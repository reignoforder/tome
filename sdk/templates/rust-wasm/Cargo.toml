# A Tome mod in Rust as WebAssembly: sandboxed, so players aren't asked to
# trust it with their computer. Copy this folder, rename "my-rust-wasm-mod"
# (here and in tome.mod.json, where the module is my_rust_wasm_mod.wasm),
# point `tome-wasm` at the SDK (a path, or git = "<tome's repository>"), and
# build; it needs only rustup target add wasm32-unknown-unknown:
#
#   cargo build --release     # target/wasm32-unknown-unknown/release/my_rust_wasm_mod.wasm
#
# Then a folder in the game's tome/mods/ with the .wasm and tome.mod.json.
[package]
name = "my-rust-wasm-mod"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tome-wasm = { path = "../../rust/wasm/tome-wasm" }

[profile.release]
strip = true
lto = true
opt-level = "s"
