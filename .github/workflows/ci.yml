# SPDX-License-Identifier: GPL-3.0-or-later
# Builds Tome and runs `make test` in the tools/container image's `ci` stage
# (the same toolchain, Wine and Rust targets as `make container-test`,
# without what running the game needs). Runs only when asked: "Run workflow" (Actions tab, or `gh workflow run
# ci.yml`), or a v* tag, which makes the release. Without the game
# the tests on game.dll skip themselves; the e2e test needs the game (and a
# developer build) and doesn't run here. The build is a release one
# (DEV=OFF: tome.mix ignores the TOME_DEBUG_* variables), so the player
# download and the SDK zip come from it. A v* tag also makes a draft
# release with both zips, their SHA-256s and the WAMR source archive the
# build used (the GPL's corresponding source: loader/third_party/NOTICES.md);
# publish it by hand after a look and after signing SHA256SUMS offline
# (docs/releasing.md; release-check.yml takes an unsigned one back to draft). Each file (and tome.mix on its own) gets
# a build provenance attestation: a record in Sigstore's public log that this
# workflow built it from the tagged commit, which anyone can check with
# `gh attestation verify <file> --repo reignoforder/tome` (public
# repositories only on this plan: skipped while the repository is private).
# Actions are pinned to commits (the
# version in a comment); Dependabot proposes updates (.github/dependabot.yml).
name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The image (~5.7 GB, twice: in the buildx builder and once loaded into
      # docker) and the build (~3 GB, two Wine prefixes) don't fit in the
      # runner's free space: drop the preinstalled SDKs nothing here uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      # Only the Containerfile's `ci` stage (no Xvfb, Mesa or sound: CI never
      # runs the game). Its layers come from the Actions cache, so it's only
      # built again when the Containerfile changes or the cache expired.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build the container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: tools/container
          file: tools/container/Containerfile
          target: ci
          tags: tome-dev
          load: true
          cache-from: type=gha,scope=tome-ci
          cache-to: type=gha,mode=max,scope=tome-ci

      # The image is in docker and its layers in the Actions cache now: the
      # builder's copy is only taking space.
      - name: Empty the buildx builder
        run: |
          docker buildx prune --all --force
          df -h /

      # What the image was built from: the same packages give the same bytes
      # (docs/releasing.md, reproducible builds). Published with a release.
      - name: Toolchain
        run: |
          mkdir -p build-container
          docker run --rm tome-dev rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort > build-container/toolchain.txt

      - name: Build and test
        run: make container-test ENGINE=docker IMAGE_READY=1 DEV=OFF

      - name: Release build check
        run: grep -qx 'TOME_DEV:BOOL=OFF' build-container/CMakeCache.txt

      - name: SDK zip
        run: make container-sdk ENGINE=docker IMAGE_READY=1 DEV=OFF

      - name: Player download
        run: make container-dist ENGINE=docker IMAGE_READY=1 CONTAINER_RELEASE_BUILD=build-container

      # What the build downloaded and checked against wamr.cmake's SHA-256.
      - name: WAMR source archive
        run: cp build-container/_deps/WAMR-*.tar.gz build-container/

      # The parsers of untrusted bytes (fuzz/), 30 s each: a regression
      # check, not a search (tools/fuzz.sh runs them longer by hand).
      - name: Fuzz
        run: make container-fuzz ENGINE=docker IMAGE_READY=1 FUZZ_SECONDS=30

      - name: Test log
        if: failure()
        run: cat build-container/Testing/Temporary/LastTest.log || true

      - name: Fuzz crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-crashes
          path: build-container-fuzz/crashes/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tome-build
          path: |
            build-container/loader/tome.mix
            build-container/tome-*.zip
            build-container/WAMR-*.tar.gz
            build-container/toolchain.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write          # the attestation's Sigstore certificate
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Tag matches the version
        run: |
          version=$(sed -n 's/^project(tome VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but CMakeLists.txt says $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Tome only announces releases signed with a key in this file
      # (docs/releasing.md): a release without one could never be signed.
      - name: Release key
        run: python3 -I tools/release_sign.py check-keys

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: tome-build
          path: dist

      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            dist/tome-*.zip
            dist/WAMR-*.tar.gz
            dist/loader/tome.mix

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          wamr=$(echo WAMR-*.tar.gz)
          files=(tome-"$VERSION".zip tome-sdk-"$VERSION".zip "$wamr" toolchain.txt)
          sha256sum "${files[@]}" > SHA256SUMS
          {
            echo "Unofficial, not affiliated with Blizzard Entertainment: read DISCLAIMER.md."
            echo
            echo "- **tome-$VERSION.zip**: for players. Unpack it into your Warcraft III 1.27b folder (next to war3.exe); tome/README.txt inside says the rest."
            echo "- **tome-sdk-$VERSION.zip**: for mod makers (sdk/README.md)."
            echo "- **$wamr**: the WebAssembly runtime's source, as the build used it (with loader/third_party/wamr/patch.cmake)."
            echo "- **toolchain.txt**: the build image's packages (docs/releasing.md: rebuilding a release to check it)."
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "SHA256SUMS.sig is the maintainer's signature of SHA256SUMS (\`tools/release_sign.py verify SHA256SUMS\`, keys in \`loader/release-keys.txt\`). Tome's update check only announces signed releases."
            echo
            if [ "${{ github.event.repository.visibility }}" = public ]; then
              echo "Built by this repository's CI from \`$GITHUB_REF_NAME\` ($GITHUB_SHA). To check that a file (or an installed tome.mix) came from that build:"
              echo
              echo '```'
              echo "gh attestation verify tome-$VERSION.zip --repo $GITHUB_REPOSITORY"
              echo '```'
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Tome $VERSION" --notes-file notes.md "${files[@]}" SHA256SUMS
